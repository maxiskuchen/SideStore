name: Nightly SideStore Build

on:
  push:
    branches:
      - develop
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.editorconfig'
      - '.gitignore'
      - '.gitmodules'
      - '.github/**'
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26-intel

    env:
      DEPLOY_KEY: ${{ secrets.CROSS_REPO_PUSH_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_NAME: Nightly
      CHANNEL: nightly
      UPSTREAM_CHANNEL: ""

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Debug RemotePairingKit source
        run: |
          echo "=== SideStore commit ==="
          git rev-parse HEAD

          echo "=== Minimuxer commit ==="
          git -C Dependencies/minimuxer rev-parse HEAD

          echo "=== Minimuxer Package.swift ==="
          grep -n -A3 -B3 "RemotePairingKit" \
            Dependencies/minimuxer/DeviceGateway/Package.swift || true

          echo "=== Minimuxer Package.resolved ==="
          grep -n -A8 -B2 "remotepairingkit" \
            Dependencies/minimuxer/Package.resolved || true

          echo "=== SideStore Package.resolved ==="
          grep -n -A8 -B2 "remotepairingkit" \
            AltStore.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved || true

      - name: Find Last Successful commit
        run: |
          LAST_SUCCESSFUL_COMMIT=$(python3 scripts/ci/workflow.py last-successful-commit \
            "false" "${{ env.CHANNEL }}" || echo "")
          echo "LAST_SUCCESSFUL_COMMIT=$LAST_SUCCESSFUL_COMMIT" | tee -a "$GITHUB_ENV"

      - name: Check for new changes (on schedule)
        id: check_changes
        if: github.event_name == 'schedule'
        run: |
          NEW_COMMITS=$(python3 scripts/ci/workflow.py count-new-commits "$LAST_SUCCESSFUL_COMMIT")
          SHOULD_BUILD=$([ "${NEW_COMMITS:-0}" -ge 1 ] && echo true || echo false)

          echo "should_build=$SHOULD_BUILD" >> "$GITHUB_OUTPUT"
          echo "NEW_COMMITS=$NEW_COMMITS" | tee -a "$GITHUB_ENV"

      - name: Should Skip Building (on schedule)
        id: build_gate
        run: |
          SHOULD_SKIP=$(
            {
              [ "${{ github.event_name }}" = "schedule" ] &&
              [ "${{ steps.check_changes.outputs.should_build }}" != "true" ];
            } && echo true || echo false
          )

          echo "should_skip=$SHOULD_SKIP" >> "$GITHUB_OUTPUT"

      - name: Install build tools
        if: steps.build_gate.outputs.should_skip != 'true'
        run: |
          brew install ldid xcbeautify

      - name: Setup Env
        if: steps.build_gate.outputs.should_skip != 'true'
        run: |
          BUILD_NUM="${{ github.run_number }}"
          MARKETING_VERSION=$(python3 scripts/ci/workflow.py get-marketing-version)
          SHORT_COMMIT=$(python3 scripts/ci/workflow.py commit-id)

          NORMALIZED_VERSION=$(python3 scripts/ci/workflow.py compute-normalized \
            "$MARKETING_VERSION" \
            "$BUILD_NUM" \
            "$SHORT_COMMIT")

          python3 scripts/ci/workflow.py set-marketing-version "$NORMALIZED_VERSION"

          echo "BUILD_NUM=$BUILD_NUM" | tee -a "$GITHUB_ENV"
          echo "SHORT_COMMIT=$SHORT_COMMIT" | tee -a "$GITHUB_ENV"
          echo "MARKETING_VERSION=$NORMALIZED_VERSION" | tee -a "$GITHUB_ENV"

      - name: Setup Xcode
        if: steps.build_gate.outputs.should_skip != 'true'
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: "26.6"

      - name: Install Swift 6.4.x toolchain
        if: steps.build_gate.outputs.should_skip != 'true'
        run: |
          echo "=== Installing Swiftly ==="

          curl -O https://download.swift.org/swiftly/darwin/swiftly.pkg

          installer \
            -pkg swiftly.pkg \
            -target CurrentUserHomeDirectory

          ~/.swiftly/bin/swiftly init --quiet-shell-followup

          source "${SWIFTLY_HOME_DIR:-$HOME/.swiftly}/env.sh"

          echo "=== Installing latest Swift 6.4.x snapshot ==="

          swiftly install 6.4.x-snapshot

          hash -r

      - name: Verify Swift 6.4.x toolchain
        if: steps.build_gate.outputs.should_skip != 'true'
        run: |
          source "${SWIFTLY_HOME_DIR:-$HOME/.swiftly}/env.sh"

          echo "=== Swiftly installed toolchains ==="
          swiftly list

          echo "=== Default Swift ==="
          swift --version

          echo "=== Swift toolchains ==="
          ls -la ~/Library/Developer/Toolchains/

          echo "=== Swift 6.4.x toolchain through xcrun ==="
          xcrun --toolchain swift swift --version

      - name: Clear SwiftPM Cache
        if: steps.build_gate.outputs.should_skip != 'true'
        run: |
          rm -rf ~/Library/Caches/org.swift.swiftpm
          rm -rf ~/Library/Developer/Xcode/DerivedData

      - name: Clean
        if: >
          steps.build_gate.outputs.should_skip != 'true' &&
          contains(github.event.head_commit.message, '[--clean-build]')
        run: |
          python3 scripts/ci/workflow.py clean
          python3 scripts/ci/workflow.py clean-derived-data
          python3 scripts/ci/workflow.py clean-spm-cache

      - name: Clean Swift Package Artifacts
        if: steps.build_gate.outputs.should_skip != 'true'
        run: |
          rm -rf ~/Library/Caches/org.swift.swiftpm/artifacts
          rm -rf ~/Library/Developer/Xcode/DerivedData

      - name: Build
        id: build
        if: steps.build_gate.outputs.should_skip != 'true'
        env:
          BUILD_LOG_ZIP_PASSWORD: ${{ secrets.BUILD_LOG_ZIP_PASSWORD }}
        run: |
          set -o pipefail

          source "${SWIFTLY_HOME_DIR:-$HOME/.swiftly}/env.sh"

          echo "=== Xcode version ==="
          xcodebuild -version

          echo "=== Swift version ==="
          swift --version

          echo "=== SwiftPM version ==="
          swift package --version

          echo "=== Removing all SwiftPM state ==="
          rm -rf "$RUNNER_TEMP/SourcePackages"
          rm -rf "$RUNNER_TEMP/SourcePackages-Checkouts"
          rm -rf ~/Library/Caches/org.swift.swiftpm
          rm -rf ~/Library/Developer/Xcode/DerivedData

          echo "=== Resolving Swift packages with Swift 6.4.x toolchain ==="

          xcodebuild \
            -toolchain swift \
            -resolvePackageDependencies \
            -project AltStore.xcodeproj \
            -scheme SideStore \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            IDEPackageSupportUseBuiltinSCM=YES \
            2>&1 | tee package-resolution.log

          STATUS=${PIPESTATUS[0]}

          if [ "$STATUS" -ne 0 ]; then
            echo "Swift package resolution failed"
            exit "$STATUS"
          fi

          echo "=== Building SideStore ==="

          make -B build 2>&1 | tee build-raw.log
          STATUS=${PIPESTATUS[0]}

          exit "$STATUS"